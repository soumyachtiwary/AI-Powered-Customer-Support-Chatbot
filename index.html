<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Customer Support Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="chat-card">
            <div class="header">
                <h1>AI Support Chatbot</h1>
                <p>NLP-powered FAQ assistant</p>
            </div>

            <div id="chat-box" class="chat-box">
                <div class="message bot">
                    Hello! 👋 Ask me a customer-support question.
                </div>
            </div>

            <div class="input-area">
                <input id="message" type="text"
                       placeholder="Type your question..."
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>

            <div class="examples">
                Try: "How do I reset my password?"
            </div>
        </div>
    </div>

<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chatBox = document.getElementById("chat-box");
    const message = input.value.trim();

    if (!message) return;

    chatBox.innerHTML += `<div class="message user">${escapeHtml(message)}</div>`;
    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
    });

    const data = await response.json();
    chatBox.innerHTML += `<div class="message bot">${escapeHtml(data.response)}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
